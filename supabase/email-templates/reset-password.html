<h2>Reset your password</h2>
<p>Someone (hopefully you) asked to reset the password for this account. Click the button to choose a new one. The link works for one hour.</p>
<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
     style="display:inline-block;padding:12px 20px;border-radius:999px;background:#17171B;color:#ffffff;text-decoration:none;font-weight:600">
    Choose a new password
  </a>
</p>
<p style="color:#6A6A72;font-size:14px">If you didn't ask for this, ignore this email. Your password won't change.</p>
