<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledger — Arjun Raghavan</title>
<meta name="description" content="Arjun Raghavan — Senior Product Designer for fintech and health. Metrics-first case-study portfolio template.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Figtree:ital,wght@0,400..700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a product dashboard turned portfolio — bento tiles for impact, every case card carries its numbers, case studies read like a well-kept report with a sticky index. */
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --surface-2:#E9EDE7; --ink:#0F1A14; --ink-2:#46524B; --mute:#78837C; --line:#DCE2DA;
  --green:#0D6A46; --green-2:#0A5538; --mint:#D6EFE0; --amber:#FFC23D; --amber-ink:#4A3600; --red:#C2410C;
  --f-disp:"Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --f-body:"Figtree", "Avenir Next", "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --shadow:0 1px 0 rgba(15,26,20,.04),0 12px 32px -18px rgba(15,26,20,.22);
  --out:cubic-bezier(.16,1,.3,1); --spring:cubic-bezier(.34,1.4,.64,1);
  --g:clamp(16px,3.4vw,48px); --max:1280px; --r:22px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C120F; --surface:#141C17; --surface-2:#1C2620; --ink:#E8EFEA; --ink-2:#AAB7AF; --mute:#7C8982; --line:#26322B;
  --green:#3DD68C; --green-2:#2FB877; --mint:#14301F; --amber:#FFC23D; --amber-ink:#2A1F00; --red:#FB923C;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 32px -18px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C120F; --surface:#141C17; --surface-2:#1C2620; --ink:#E8EFEA; --ink-2:#AAB7AF; --mute:#7C8982; --line:#26322B;
  --green:#3DD68C; --green-2:#2FB877; --mint:#14301F; --amber:#FFC23D; --amber-ink:#2A1F00; --red:#FB923C;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 32px -18px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background .4s,color .4s}
body.menu-open{overflow:hidden}
main{overflow-x:clip}
a{color:inherit}
::selection{background:var(--amber);color:var(--amber-ink)}
:focus-visible{outline:2px solid var(--green);outline-offset:3px;border-radius:6px}
.wrap{max-width:var(--max);margin:0 auto;padding-inline:var(--g)}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:0}
.mute{color:var(--mute)}
.tab-num{font-variant-numeric:tabular-nums}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;z-index:200;background:var(--ink);color:var(--bg);padding:8px}
mark.hlt{background:linear-gradient(transparent 58%,var(--amber) 58%);color:inherit;padding:0 .08em}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .3s}
.hdr.sc{border-bottom-color:var(--line)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--f-disp);font-weight:700;font-size:18px;letter-spacing:-.02em}
.brand .av{width:34px;height:34px;border-radius:10px;background:var(--green);color:var(--bg);display:grid;place-items:center;font-size:14px;transition:transform .5s var(--spring)}
.brand:hover .av{transform:rotate(-8deg) scale(1.08)}
.hnav{display:flex;align-items:center;gap:2px}
.hnav a{text-decoration:none;font-weight:500;font-size:15px;padding:8px 12px;border-radius:10px;color:var(--ink-2);transition:background .25s,color .25s}
.hnav a:hover,.hnav a.on{background:var(--surface-2);color:var(--ink)}
.hr{display:flex;align-items:center;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:transform .3s var(--spring)}
.icon-btn:hover{transform:rotate(-12deg)}
.icon-btn svg{width:18px;height:18px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:12px;padding:11px 16px;font:600 15px var(--f-body);text-decoration:none;border:1px solid transparent;cursor:pointer;transition:transform .3s var(--spring),background .25s,box-shadow .25s}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.pri:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.btn.alt{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.alt:hover{transform:translateY(-2px);border-color:var(--ink-2)}
.btn.grn{background:var(--green);color:var(--bg)}
.btn.grn:hover{background:var(--green-2);transform:translateY(-2px)}
.btn .ar{transition:transform .3s var(--out)}.btn:hover .ar{transform:translateX(3px)}
.menu-btn{display:none}
@media (max-width:880px){.hnav,.hr .resume{display:none}.menu-btn{display:grid}}
.mnav{position:fixed;inset:0;z-index:60;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 16px) var(--g) calc(env(safe-area-inset-bottom,0px) + 24px);display:flex;flex-direction:column;gap:24px;transform:translateY(-100%);transition:transform .6s var(--out);visibility:hidden}
body.menu-open .mnav{transform:none;visibility:visible}
.mnav .top{display:flex;justify-content:space-between;align-items:center}
.mnav nav{display:grid;gap:8px}
.mnav nav a{display:flex;justify-content:space-between;align-items:center;text-decoration:none;font-family:var(--f-disp);font-weight:700;font-size:34px;letter-spacing:-.03em;padding:14px 18px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}

/* reveal */
[data-r]{transition:opacity .8s var(--out),transform .8s var(--out);transition-delay:var(--d,0s)}
[data-r].pre{opacity:0;transform:translateY(22px)}

/* transition */
.wipe{position:fixed;inset:0;z-index:90;pointer-events:none;background:var(--green);clip-path:inset(100% 0 0 0);display:grid;place-items:center}
.wipe span{font-family:var(--f-disp);font-weight:700;font-size:clamp(28px,5vw,56px);letter-spacing:-.03em;color:var(--bg);display:flex;align-items:center;gap:14px}
.wipe span i{width:12px;height:12px;border-radius:50%;background:var(--amber);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.5);opacity:.5}}

/* hero */
.hero{padding-block:clamp(48px,7vw,96px) clamp(32px,4vw,56px);display:grid;grid-template-columns:1.5fr 1fr;gap:clamp(24px,4vw,56px);align-items:end}
.status{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border-radius:999px;background:var(--mint);color:var(--green);font-weight:600;font-size:14px;margin-bottom:24px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 var(--green);animation:ring 2s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--green) 50%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
.hero h1{font-family:var(--f-disp);font-weight:700;font-size:clamp(42px,6.2vw,88px);line-height:.98;letter-spacing:-.045em;margin:0;text-wrap:balance}
.hero h1 .num{color:var(--green);font-style:normal;white-space:nowrap}
.hero p.sub{font-size:clamp(18px,1.5vw,21px);color:var(--ink-2);max-width:46ch;margin:22px 0 0}
.domains{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.domains span{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:500;transition:transform .3s var(--spring)}
.domains span:hover{transform:translateY(-2px) rotate(-1deg)}
.domains span b{width:8px;height:8px;border-radius:2px;display:inline-block}
.hero-ctas{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.now{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);display:grid;gap:16px}
.now .hd{display:flex;justify-content:space-between;align-items:center}
.now h3{margin:0;font-family:var(--f-disp);font-size:20px;letter-spacing:-.02em;font-weight:700}
.now p{margin:0;color:var(--ink-2);font-size:15px}
.now .bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.now .bar i{display:block;height:100%;width:68%;background:var(--green);border-radius:999px;animation:grow 1.6s var(--out)}
@keyframes grow{from{width:0}}
.now .row{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.now .logos{display:flex;gap:8px;flex-wrap:wrap}
.now .logos span{font-family:var(--f-disp);font-weight:700;font-size:14px;padding:6px 10px;border-radius:8px;background:var(--surface-2)}
@media (max-width:900px){.hero{grid-template-columns:1fr}}

/* ticker */
.ticker{border-block:1px solid var(--line);overflow:hidden;padding:16px 0;mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.ticker .tr{display:flex;gap:48px;width:max-content;animation:tick 36s linear infinite}
.ticker:hover .tr{animation-play-state:paused}
.ticker span{display:flex;align-items:baseline;gap:10px;white-space:nowrap;font-size:15px;color:var(--ink-2)}
.ticker b{font-family:var(--f-disp);font-weight:700;font-size:22px;color:var(--ink);letter-spacing:-.02em}
.ticker .up{color:var(--green);font-family:var(--f-mono);font-size:12px}
@keyframes tick{to{transform:translateX(-50%)}}

/* section */
.sec{padding-block:clamp(64px,8vw,112px)}
.sh{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:clamp(28px,4vw,48px)}
.sh .eb{display:block;font-family:var(--f-mono);font-size:12px;color:var(--green);margin-bottom:10px}
.sh h2{font-family:var(--f-disp);font-weight:700;font-size:clamp(32px,4.4vw,58px);line-height:1;letter-spacing:-.04em;margin:0;max-width:18ch;text-wrap:balance}
.sh p{margin:0;color:var(--ink-2);max-width:40ch}

/* bento */
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(170px,auto);gap:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;justify-content:space-between;gap:16px;transition:transform .4s var(--spring),box-shadow .4s;min-width:0}
.tile:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.tile.w2{grid-column:span 2}.tile.h2{grid-row:span 2}
.tile .lbl{font-size:14px;color:var(--mute);display:flex;justify-content:space-between;gap:8px}
.tile .big{font-family:var(--f-disp);font-weight:700;font-size:clamp(40px,4.6vw,64px);line-height:.95;letter-spacing:-.05em}
.tile .big small{font-size:.45em;letter-spacing:-.02em;color:var(--mute);font-weight:600}
.tile p{margin:0;color:var(--ink-2);font-size:15px}
.tile.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tile.dark .lbl,.tile.dark p{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.tile.green{background:var(--green);color:var(--bg);border-color:var(--green)}
.tile.green .lbl,.tile.green p{color:color-mix(in srgb,var(--bg) 78%,transparent)}
.spark{width:100%;height:auto;display:block}
.spark .area{fill:color-mix(in srgb,var(--green) 16%,transparent)}
.spark .ln{fill:none;stroke:var(--green);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:400;stroke-dashoffset:0}
.spark .grid{stroke:var(--line);stroke-width:1}
.spark .pt{fill:var(--surface);stroke:var(--green);stroke-width:2}
.spark text{font:500 9px var(--f-mono);fill:var(--mute)}
.tile.dark .spark .ln{stroke:var(--amber)}.tile.dark .spark .area{fill:color-mix(in srgb,var(--amber) 18%,transparent)}.tile.dark .spark .grid{stroke:color-mix(in srgb,var(--bg) 14%,transparent)}.tile.dark .spark .pt{fill:var(--ink);stroke:var(--amber)}
.bars{display:flex;gap:8px;align-items:flex-end;height:120px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars i{width:100%;border-radius:8px 8px 4px 4px;background:color-mix(in srgb,var(--bg) 30%,transparent);transform-origin:bottom}
.bars div:last-child i{background:var(--amber)}
.bars span{font:500 10px var(--f-mono);opacity:.8}
.flags{display:flex;flex-wrap:wrap;gap:6px}
.flags span{background:var(--surface-2);border-radius:8px;padding:5px 9px;font-size:13px;font-weight:500}
@media (max-width:900px){.bento{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.bento{grid-template-columns:1fr}.tile.w2,.tile.h2{grid-column:auto;grid-row:auto}}

/* work */
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:5px;border-radius:14px;background:var(--surface-2);width:fit-content;max-width:100%}
.filters button{border:0;background:transparent;color:var(--ink-2);font:600 14px var(--f-body);padding:8px 14px;border-radius:10px;cursor:pointer;transition:background .25s,color .25s}
.filters button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.filters .ct{font:500 11px var(--f-mono);color:var(--mute);margin-left:4px}
.cases{display:grid;gap:18px}
.case{display:grid;grid-template-columns:1.1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:28px;overflow:hidden;text-decoration:none;transition:transform .5s var(--out),box-shadow .5s,border-color .3s}
.case:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--green) 40%,var(--line))}
.case[hidden]{display:none}
.case .txt{padding:clamp(22px,3vw,40px);display:flex;flex-direction:column;gap:18px;justify-content:space-between;min-width:0}
.case .co{display:flex;align-items:center;gap:10px}
.case .co .lg{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;color:#fff;font-size:15px}
.case .co b{font-weight:600}
.case .tags{display:flex;gap:6px;flex-wrap:wrap}
.case .tags span{font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.case h3{font-family:var(--f-disp);font-weight:700;font-size:clamp(26px,2.8vw,40px);line-height:1.02;letter-spacing:-.04em;margin:0;text-wrap:balance}
.case p{margin:0;color:var(--ink-2)}
.case .kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.case .kpi{border-top:2px solid var(--ink);padding-top:10px}
.case .kpi b{display:block;font-family:var(--f-disp);font-weight:700;font-size:clamp(30px,3vw,42px);letter-spacing:-.04em;line-height:1}
.case .kpi span{font-size:14px;color:var(--ink-2)}
.case .more{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.case .more i{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-style:normal;transition:transform .4s var(--spring)}
.case:hover .more i{transform:rotate(-45deg) scale(1.1)}
.case .vis{background:var(--tone);position:relative;min-height:380px;overflow:hidden;display:grid;place-items:center}
.case .vis .ph{transition:transform .8s var(--out)}
.case:hover .vis .ph{transform:translateY(-10px) rotate(-2deg)}
.case:nth-child(even){grid-template-columns:1fr 1.1fr}
.case:nth-child(even) .vis{order:-1}
@media (max-width:900px){.case,.case:nth-child(even){grid-template-columns:1fr}.case .vis,.case:nth-child(even) .vis{order:-1;min-height:300px}}

/* phone mock */
.ph{width:min(220px,58%);aspect-ratio:9/18.5;background:#0F1A14;border-radius:34px;padding:9px;box-shadow:0 40px 60px -30px rgba(15,26,20,.55)}
.ph .scr{width:100%;height:100%;border-radius:26px;background:#FFFFFF;overflow:hidden;display:flex;flex-direction:column;gap:7px;padding:22px 12px 12px;position:relative;color:#0F1A14;font-family:var(--f-body)}
.ph .scr::before{content:"";position:absolute;left:50%;top:7px;width:56px;height:14px;border-radius:999px;background:#0F1A14;transform:translateX(-50%)}
.ph .t{font-size:9px;color:#78837C}.ph .h{font-family:var(--f-disp);font-weight:700;font-size:15px;letter-spacing:-.03em;line-height:1.1}
.ph .card{border-radius:12px;padding:9px;background:#F3F5F1;font-size:9px;display:grid;gap:4px}
.ph .row{display:flex;justify-content:space-between;align-items:center;font-size:9px}
.ph .pill{border-radius:999px;padding:7px;text-align:center;font-size:10px;font-weight:600;background:#0D6A46;color:#fff;margin-top:auto}
.ph .ln{height:5px;border-radius:3px;background:#E1E6DF}
.ph .amt{font-family:var(--f-disp);font-weight:700;font-size:22px;letter-spacing:-.04em}
.ph .chip{display:inline-block;border-radius:999px;padding:3px 7px;font-size:8px;background:#D6EFE0;color:#0D6A46;font-weight:600}
.ph .bad{background:#FDE7DA;color:#C2410C}
.ph .q{display:flex;gap:6px;align-items:center}.ph .q b{width:22px;height:22px;border-radius:50%;background:#E1E6DF;display:grid;place-items:center;font-size:9px}
.ph .q b.on{background:#0D6A46;color:#fff}
.ph.old .scr{background:#F7F7F7}
.ph.old .card{background:#ECECEC}
.ph.old .pill{background:#9AA39D}

/* process */
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;counter-reset:s}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;position:relative;transition:background .3s,color .3s,transform .4s var(--spring)}
.step:hover{background:var(--ink);color:var(--bg);transform:translateY(-4px)}
.step:hover p{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.step .n{font-family:var(--f-mono);font-size:12px;color:var(--green)}
.step h4{font-family:var(--f-disp);font-weight:700;font-size:20px;letter-spacing:-.02em;margin:10px 0 6px}
.step p{margin:0;font-size:14px;color:var(--ink-2)}
.step .w{font-family:var(--f-mono);font-size:11px;color:var(--mute);margin-top:12px;display:block}
@media (max-width:980px){.steps{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.steps{grid-template-columns:1fr}}

/* testimonials */
.tests{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.test{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;justify-content:space-between;gap:20px;margin:0}
.test blockquote{margin:0;font-size:17px;line-height:1.5}
.test figcaption{display:flex;align-items:center;gap:12px;font-size:14px}
.test .ini{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;background:var(--mint);color:var(--green)}
.test figcaption b{display:block}
.stars{color:var(--amber);letter-spacing:2px}
@media (max-width:900px){.tests{grid-template-columns:1fr}}

/* writing */
.posts{border-top:1px solid var(--line)}
.post{display:grid;grid-template-columns:100px 1fr auto 40px;gap:20px;align-items:center;padding:20px 8px;border-bottom:1px solid var(--line);text-decoration:none;transition:background .3s,padding .4s var(--out);border-radius:12px}
.post:hover{background:var(--surface);padding-inline:18px}
.post h4{margin:0;font-family:var(--f-disp);font-weight:600;font-size:clamp(18px,1.8vw,22px);letter-spacing:-.02em}
.post p{margin:2px 0 0;color:var(--ink-2);font-size:15px}
.post .ar{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:all .3s var(--spring)}
.post:hover .ar{background:var(--green);color:var(--bg);border-color:var(--green);transform:rotate(-45deg)}
@media (max-width:760px){.post{grid-template-columns:1fr 36px}.post .mono{display:none}}

/* contact */
.cta{background:var(--ink);color:var(--bg);border-radius:32px;padding:clamp(28px,5vw,72px);display:grid;grid-template-columns:1.2fr 1fr;gap:clamp(24px,4vw,64px);position:relative;overflow:hidden}
.cta::after{content:"";position:absolute;right:-120px;top:-120px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--green) 60%,transparent),transparent 70%);pointer-events:none}

{slug:'kosha-credit',co:'Kosha',lg:'#0D6A46',cat:'Fintech',year:'2026',ph:'credit',tone:'linear-gradient(160deg,#D6EFE0,#A8DDBF)',

function spark(data,w=220,h=70,labels){const max=Math.max(...data),min=Math.min(...data),pad=6,sx=(w-pad*2)/(data.length-1),sy=v=>h-pad-((v-min)/(max-min||1))*(h-pad*2-12);
 const pts=data.map((v,i)=>[pad+i*sx,sy(v)]);const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
 const last=pts[pts.length-1];
 return `<svg class="spark" viewBox="0 0 ${w} ${h}" role="img" aria-label="Trend from ${data[0]} to ${data[data.length-1]}"><line class="grid" x1="${pad}" x2="${w-pad}" y1="${h-pad}" y2="${h-pad}"/><path class="area" d="${d} L${last[0]} ${h-pad} L${pad} ${h-pad} Z"/><path class="ln" d="${d}"/><circle class="pt" cx="${last[0]}" cy="${last[1]}" r="4"/>${labels?`<text x="${pad}" y="${h-pad-4+12}" dy="-14">${labels[0]}</text><text x="${w-pad}" y="${h-pad-2}" text-anchor="end" dy="-12">${labels[1]}</text>`:''}</svg>`}
const ICON={sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>'};

 app.innerHTML=r.v==='cs'?cs(r.p):r.v==='about'?about():home();
 document.title=r.v==='cs'?`${r.p.co}: ${r.p.title} — Arjun Raghavan`:r.v==='about'?'About — Arjun Raghavan':'Ledger — Arjun Raghavan';
 $$('.hnav a[data-nav]').forEach(a=>a.classList.toggle('on',(r.v==='about'&&a.dataset.nav==='about')||(r.v==='cs'&&a.dataset.nav==='work')));
 jump(0);init(r);if(r.sec)requestAnimationFrame(()=>toSection(r.sec,true));
 if(!first){app.focus({preventScroll:true});await anim(w,[{clipPath:'inset(0 0 0 0)'},{clipPath:'inset(0 0 100% 0)'}],{duration:560,delay:60,easing:'cubic-bezier(.76,0,.24,1)'})}
 busy=false}

let lenis=null;
if(window.Lenis&&!reduce){lenis=new Lenis({lerp:.1});const raf=t=>{lenis.raf(t);requestAnimationFrame(raf)};requestAnimationFrame(raf)}
const jump=y=>lenis?lenis.scrollTo(y,{immediate:true,force:true}):scrollTo(0,y);
function toSection(id,inst){const el=document.getElementById(id);if(!el)return;if(id==='top'){lenis?lenis.scrollTo(0,{immediate:!!inst}):scrollTo({top:0,behavior:inst?'auto':'smooth'});return}
 lenis?lenis.scrollTo(el,{offset:-72,immediate:!!inst}):el.scrollIntoView({behavior:inst?'auto':'smooth'})}
addEventListener('scroll',()=>$('#hdr').classList.toggle('sc',scrollY>8),{passive:true});

/* count-up */
function countUp(el){const raw=el.dataset.count;const m=raw.match(/^([^\d]*)([\d.,]+)(.*)$/);if(!m||reduce)return;
 const pre=m[1],num=parseFloat(m[2].replace(/,/g,'')),suf=m[3],dec=(m[2].split('.')[1]||'').length;const t0=performance.now(),D=1400;
 const step=t=>{const p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,4);el.textContent=pre+(num*e).toLocaleString('en-IN',{minimumFractionDigits:dec,maximumFractionDigits:dec})+suf;if(p<1)requestAnimationFrame(step);else el.textContent=raw};requestAnimationFrame(step)}

let io,cleanups=[];
function teardown(){cleanups.forEach(f=>f());cleanups=[];io&&io.disconnect()}
function on(t,e,f,o){t.addEventListener(e,f,o);cleanups.push(()=>t.removeEventListener(e,f,o))}
function init(r){
 io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const el=e.target;el.classList.remove('pre');$$('[data-count]',el).forEach(countUp);if(el.dataset.count)countUp(el);
   $$('.bars i',el).forEach((b,k)=>b.animate&&!reduce&&b.animate([{transform:'scaleY(0)'},{transform:'scaleY(1)'}],{duration:900,delay:k*80,easing:'cubic-bezier(.16,1,.3,1)',fill:'backwards'}));
   $$('.chart .tr i',el).forEach((b,k)=>{const s=b.style.transform;if(!reduce){b.style.transform='scaleX(0)';requestAnimationFrame(()=>requestAnimationFrame(()=>{b.style.transitionDelay=k*60+'ms';b.style.transform=s}))}});
   $$('.spark .ln',el).forEach(l=>!reduce&&l.animate([{strokeDashoffset:400},{strokeDashoffset:0}],{duration:1400,easing:'cubic-bezier(.16,1,.3,1)'}));
   io.unobserve(el)}}),{rootMargin:'0px 0px -8% 0px'});
 $$('[data-r]',app).forEach(el=>{if(!reduce&&el.getBoundingClientRect().top>innerHeight*.9){el.classList.add('pre');io.observe(el)}});

 // filters
 $$('[data-f]',app).forEach(b=>b.onclick=()=>{$$('[data-f]',app).forEach(x=>x.setAttribute('aria-pressed',x===b));const f=b.dataset.f;
  $$('.case',app).forEach(c=>{const show=f==='All'||c.dataset.cat===f;c.hidden=!show;if(show){c.classList.remove('pre');!reduce&&c.animate([{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],{duration:500,easing:'cubic-bezier(.16,1,.3,1)'})}})});

 // before/after
 $$('.ba',app).forEach(ba=>{const inp=$('.ba-range',ba);const set=()=>ba.style.setProperty('--x',inp.value+'%');inp.oninput=set;set()});

 // toc progress
 if(r.v==='cs'){const links=$$('.toc a',app);
  links.forEach(a=>a.addEventListener('click',e=>{e.preventDefault();const el=document.getElementById(a.dataset.to);lenis?lenis.scrollTo(el,{offset:-80}):el.scrollIntoView({behavior:'smooth'})}));
  const upd=()=>{let active=null;links.forEach(a=>{const el=document.getElementById(a.dataset.to);if(!el)return;const b=el.getBoundingClientRect();const p=Math.min(1,Math.max(0,(innerHeight*.4-b.top)/b.height));a.querySelector('b').style.setProperty('--p',p);if(b.top<innerHeight*.45)active=a});
   links.forEach(a=>a.classList.toggle('on',a===active))};on(window,'scroll',upd,{passive:true});upd()}

 // form
 const f=$('#cf',app);
 if(f)f.onsubmit=e=>{e.preventDefault();const n=$('#cf-n',f).value.trim(),em=$('#cf-e',f).value.trim(),m=$('#cf-m',f).value.trim(),out=$('#cfMsg',f);
  const fail=(t,id)=>{out.textContent=t;out.className='msg bad';$(id,f).focus()};
  if(n.length<2)return fail('Add your name so I know who to reply to.','#cf-n');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em))return fail('That email doesn’t look right. Try name@company.com.','#cf-e');
  if(m.length<10)return fail('Add a sentence about what you’re working on.','#cf-m');
  out.className='msg ok';out.textContent=`Thanks ${n.split(' ')[0]}, I reply within two working days. (Template demo: nothing was sent.)`;f.reset()};
}

/* theme */
const root=document.documentElement;
function curTheme(){return root.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
function paintIcon(){$('#themeBtn').innerHTML=curTheme()==='dark'?ICON.sun:ICON.moon;$('#themeBtn').setAttribute('aria-label',curTheme()==='dark'?'Switch to light theme':'Switch to dark theme')}
try{const s=localStorage.getItem('ledger-theme');if(s)root.dataset.theme=s}catch(e){}
paintIcon();
$('#themeBtn').onclick=()=>{const n=curTheme()==='dark'?'light':'dark';root.dataset.theme=n;try{localStorage.setItem('ledger-theme',n)}catch(e){}paintIcon()};

/* global */
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2200)}
document.addEventListener('click',async e=>{const c=e.target.closest('[data-copy]');if(!c)return;try{await navigator.clipboard.writeText(c.dataset.copy);toast('Email copied')}catch(err){const s=getSelection(),rg=document.createRange();const t=$('#em')||c;rg.selectNodeContents(t);s.removeAllRanges();s.addRange(rg);toast('Selected — press Ctrl/⌘ C')}});
function openMenu(){document.body.classList.add('menu-open');$('#menuBtn').setAttribute('aria-expanded','true');$('#mnav').setAttribute('aria-hidden','false');lenis&&lenis.stop()}
function closeMenu(){if(!document.body.classList.contains('menu-open'))return;document.body.classList.remove('menu-open');$('#menuBtn').setAttribute('aria-expanded','false');$('#mnav').setAttribute('aria-hidden','true');lenis&&lenis.start()}
$('#menuBtn').onclick=openMenu;$('#menuClose').onclick=closeMenu;addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(a&&a.getAttribute('href')===location.hash&&!a.dataset.to){e.preventDefault();go()}});
addEventListener('hashchange',go);go();
})();
</script>
