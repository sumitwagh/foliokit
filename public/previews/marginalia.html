<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marginalia — Noor Haddad</title>
<meta name="description" content="Noor Haddad — Senior Product Designer at Fieldnote. Editorial portfolio template.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a magazine page — 12-col grid, wide outer margins that hold marginal notes, highlighter as the only loud gesture. */
:root{
  --paper:#FBFAF6; --paper-2:#F3F0E7; --card:#FFFFFF;
  --ink:#1B1D2A; --ink-2:#464857; --muted:#7A7B86; --rule:#E2DED3;
  --hl-citron:#F3E870; --hl-sky:#C3E2FF; --hl-rose:#FFD2E0; --hl-mint:#CCEFD9; --hl-lilac:#E2D9FF;
  --link:#2A3BD1;
  --f-display:"Gloock", "Iowan Old Style", Georgia, serif;
  --f-body:"Newsreader", "Iowan Old Style", Georgia, serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --ease:cubic-bezier(.2,.8,.2,1); --ease-in:cubic-bezier(.7,0,.84,0);
  --gutter:clamp(16px, 4vw, 56px);
  --max:1240px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:19px;line-height:1.55;font-optical-sizing:auto;overflow-x:hidden}
body.menu-open{overflow:hidden}
a{color:inherit}
img{max-width:100%}
::selection{background:var(--hl-citron);color:var(--ink)}
:focus-visible{outline:2px solid var(--link);outline-offset:3px;border-radius:4px}
.wrap{max-width:var(--max);margin:0 auto;padding-inline:var(--gutter)}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:var(--paper);padding:8px 12px;z-index:100}
.skip:focus{left:8px}

/* ---------- header ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--paper) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .3s}
.hdr.scrolled{border-bottom-color:var(--rule)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
.mark{display:flex;align-items:center;gap:10px;text-decoration:none}
.mark-dot{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--f-display);font-size:16px;transition:transform .5s var(--ease)}
.mark:hover .mark-dot{transform:rotate(-14deg) scale(1.06)}
.mark-name{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;align-items:center;gap:6px}
.nav a{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;padding:9px 14px;border-radius:999px;transition:background .25s}
.nav a:hover{background:var(--paper-2)}
.nav a.active{background:var(--hl-citron)}
.nav .hello{background:var(--ink);color:var(--paper)}
.nav .hello:hover{background:var(--link)}
.menu-btn{display:none;background:none;border:1px solid var(--ink);border-radius:999px;padding:8px 14px;font:500 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);cursor:pointer}
.mobile-nav{position:fixed;inset:0;z-index:60;background:var(--ink);color:var(--paper);display:flex;flex-direction:column;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 20px) var(--gutter) calc(env(safe-area-inset-bottom,0px) + 28px);clip-path:circle(0% at calc(100% - 48px) 34px);transition:clip-path .7s var(--ease);visibility:hidden}
body.menu-open .mobile-nav{clip-path:circle(150% at calc(100% - 48px) 34px);visibility:visible}
.mobile-nav .top{display:flex;justify-content:space-between;align-items:center}
.mobile-nav button{background:none;border:1px solid var(--paper);color:var(--paper);border-radius:999px;padding:8px 14px;font:500 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.mobile-nav nav{display:flex;flex-direction:column;gap:4px}
.mobile-nav nav a{font-family:var(--f-display);font-size:clamp(44px,13vw,72px);line-height:1.05;text-decoration:none;transform:translateY(30px);opacity:0;transition:transform .6s var(--ease),opacity .6s}
body.menu-open .mobile-nav nav a{transform:none;opacity:1}
body.menu-open .mobile-nav nav a:nth-child(2){transition-delay:.06s}
body.menu-open .mobile-nav nav a:nth-child(3){transition-delay:.12s}
body.menu-open .mobile-nav nav a:nth-child(4){transition-delay:.18s}
@media (max-width:760px){.nav{display:none}.menu-btn{display:inline-block}}

/* ---------- reveal + highlight ---------- */
[data-r]{transition:opacity .9s var(--ease),transform .9s var(--ease);transition-delay:var(--d,0s)}
[data-r].pre{opacity:0;transform:translateY(26px)}
.hl{background-image:linear-gradient(var(--c,var(--hl-citron)),var(--c,var(--hl-citron)));background-repeat:no-repeat;background-size:100% 88%;background-position:0 60%;padding:0 .14em;margin:0 -.04em;border-radius:.12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hl.sweep{background-size:0% 88%;animation:sweep .9s var(--ease) forwards;animation-delay:var(--d,.2s)}
@keyframes sweep{to{background-size:100% 88%}}

/* ---------- page transition ---------- */
.curtain{position:fixed;inset:0;z-index:90;pointer-events:none;display:grid;grid-template-columns:repeat(4,1fr)}
.curtain i{background:var(--ink);transform:scaleY(0);transform-origin:bottom}
.curtain i:nth-child(2){background:#23263A}.curtain i:nth-child(3){background:#2A2D44}.curtain i:nth-child(4){background:#1E2132}
.curtain-label{position:fixed;inset:0;z-index:91;display:grid;place-items:center;pointer-events:none;font-family:var(--f-display);font-size:clamp(28px,5vw,56px);color:var(--paper);opacity:0}

/* ---------- hero ---------- */
.hero{padding-block:clamp(48px,9vw,120px) clamp(40px,6vw,80px);text-align:center;position:relative}
.hero-kicker{display:inline-flex;align-items:center;gap:10px;margin-bottom:28px;color:var(--ink-2)}
.pulse{width:8px;height:8px;border-radius:50%;background:#2FA55A;box-shadow:0 0 0 0 rgba(47,165,90,.5);animation:pulse 2.2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(47,165,90,0)}100%{box-shadow:0 0 0 0 rgba(47,165,90,0)}}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(40px,6.6vw,88px);line-height:1.08;letter-spacing:-.02em;margin:0 auto;max-width:15ch;text-wrap:balance}
.hero h1 .tag{display:inline-block;transform:rotate(-1.5deg);transition:transform .4s var(--ease)}
.hero h1 .tag:hover{transform:rotate(1deg) scale(1.03)}
.underline{display:block;width:min(560px,80%);margin:10px auto 0;height:22px}
.underline path{stroke:var(--ink);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-dasharray:900;stroke-dashoffset:900;animation:draw 1.6s .9s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.hero-sub{max-width:52ch;margin:28px auto 0;color:var(--ink-2);font-size:20px;text-wrap:pretty}

.fan{position:relative;height:300px;max-width:900px;margin:56px auto 0;perspective:1200px}
.fan-card{position:absolute;left:50%;top:20px;width:min(250px,62vw);aspect-ratio:4/3.3;max-width:100%;border-radius:18px;padding:18px;background:var(--card);box-shadow:0 1px 0 rgba(27,29,42,.06),0 18px 40px -18px rgba(27,29,42,.35);border:1px solid var(--rule);transition:transform .8s var(--ease),box-shadow .5s;display:flex;flex-direction:column;justify-content:space-between;text-align:left;cursor:default}
.fan-card .mono{color:var(--ink-2)}
.fan-card h3{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.1;margin:0}
.fan-card .art{height:44%;border-radius:10px;position:relative;overflow:hidden}
.fan-card:nth-child(1){transform:translateX(-146%) translateY(14px) rotate(-8deg)}
.fan-card:nth-child(2){transform:translateX(-50%) translateY(-14px) rotate(1deg);z-index:2}
.fan-card:nth-child(3){transform:translateX(46%) translateY(14px) rotate(7deg)}
.fan:hover .fan-card:nth-child(1){transform:translateX(-160%) translateY(24px) rotate(-12deg)}
.fan:hover .fan-card:nth-child(2){transform:translateX(-50%) translateY(-34px) rotate(0deg)}
.fan:hover .fan-card:nth-child(3){transform:translateX(60%) translateY(24px) rotate(11deg)}
.fan-card:hover{box-shadow:0 1px 0 rgba(27,29,42,.06),0 30px 60px -20px rgba(27,29,42,.45)}
.art-code{background:var(--hl-sky)}
.art-code span{position:absolute;left:12px;height:6px;border-radius:4px;background:rgba(27,29,42,.55)}
.art-ai{background:var(--hl-citron)}
.art-ai b{position:absolute;border-radius:50%;background:var(--ink);animation:orbit 6s linear infinite}
@keyframes orbit{from{transform:rotate(0) translateX(26px) rotate(0)}to{transform:rotate(360deg) translateX(26px) rotate(-360deg)}}
.art-play{background:var(--hl-rose)}
.art-play i{position:absolute;bottom:0;width:22%;background:var(--ink);border-radius:6px 6px 0 0;animation:bars 2.4s var(--ease) infinite alternate}
@keyframes bars{from{height:20%}to{height:80%}}
@media (min-width:641px) and (max-width:980px){.fan-card{width:210px}.fan-card:nth-child(1){transform:translateX(-128%) translateY(14px) rotate(-8deg)}.fan-card:nth-child(3){transform:translateX(28%) translateY(14px) rotate(7deg)}}
@media (max-width:640px){
  .fan{height:auto;display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 4px 24px;perspective:none}
  .fan-card,.fan-card:nth-child(n){position:relative;left:auto;top:auto;transform:none!important;flex:0 0 72%;scroll-snap-align:center}
}

/* ---------- section heads ---------- */
.sec{padding-block:clamp(64px,9vw,120px);border-top:1px solid var(--rule)}
.sec-head{display:grid;grid-template-columns:1fr auto;align-items:end;gap:24px;margin-bottom:clamp(36px,5vw,64px)}
.sec-head h2{font-family:var(--f-display);font-weight:400;font-size:clamp(36px,5vw,64px);line-height:1;margin:0;letter-spacing:-.015em}
.sec-head p{margin:0;color:var(--muted);max-width:34ch;text-align:right}
@media (max-width:640px){.sec-head{grid-template-columns:1fr}.sec-head p{text-align:left}}

/* ---------- work list ---------- */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:36px}
.tab{font:500 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--rule);background:transparent;color:var(--ink-2);padding:9px 14px;border-radius:999px;cursor:pointer;transition:all .25s}
.tab:hover{border-color:var(--ink);color:var(--ink)}
.tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.work-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(28px,4vw,56px) clamp(16px,2.4vw,32px)}
.proj{grid-column:span 6;text-decoration:none;display:flex;flex-direction:column;gap:18px;min-width:0}
.proj.wide{grid-column:span 12}
.proj.wide .proj-media{aspect-ratio:21/9}
.proj[hidden]{display:none}
.proj-media{aspect-ratio:4/3;border-radius:20px;background:var(--tone,var(--paper-2));position:relative;overflow:hidden;display:grid;place-items:center;padding:clamp(18px,4%,44px);max-width:100%}
.proj-media .win{transition:transform .9s var(--ease)}
.proj:hover .proj-media .win{transform:translateY(-8px) rotate(-1.2deg) scale(1.02)}
.proj-meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted)}
.proj h3{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,2.6vw,34px);line-height:1.12;margin:0;text-wrap:balance}
.proj h3 span{background-image:linear-gradient(var(--hl-citron),var(--hl-citron));background-repeat:no-repeat;background-size:0% 40%;background-position:0 88%;transition:background-size .6s var(--ease)}
.proj:hover h3 span{background-size:100% 40%}
.proj p{margin:0;color:var(--ink-2);max-width:56ch}
.soon{position:absolute;top:16px;left:16px;background:var(--ink);color:var(--paper);padding:6px 10px;border-radius:999px}
@media (max-width:760px){.proj,.proj.wide{grid-column:span 12}.proj.wide .proj-media{aspect-ratio:4/3}}

/* ---------- app window mock ---------- */
.win{width:100%;max-width:640px;background:var(--card);border-radius:14px;box-shadow:0 30px 60px -30px rgba(27,29,42,.45),0 0 0 1px rgba(27,29,42,.06);overflow:hidden;font-family:var(--f-mono);font-size:10px;color:var(--ink-2)}
.win-bar{display:flex;align-items:center;gap:6px;padding:9px 12px;border-bottom:1px solid var(--rule);background:#FCFBF8}
.win-bar i{width:8px;height:8px;border-radius:50%;background:var(--rule)}
.win-bar span{margin-left:8px;letter-spacing:.04em}
.win-body{display:grid;min-height:200px}
.ln{display:block;height:6px;border-radius:4px;background:#E9E6DD;margin:7px 0}
.ln.d{background:#C9C6BD}.ln.k{background:var(--ink)}
.w90{width:90%}.w80{width:80%}.w70{width:70%}.w60{width:60%}.w50{width:50%}.w40{width:40%}.w30{width:30%}.w20{width:20%}
.k-ai{grid-template-columns:22% 1fr 34%}
.k-ai .side{border-right:1px solid var(--rule);padding:12px;background:#FCFBF8}
.k-ai .doc{padding:16px}
.k-ai .doc .hd{font-family:var(--f-display);font-size:15px;color:var(--ink);margin-bottom:8px}
.k-ai .doc mark{display:block;background:var(--hl-citron);height:6px;border-radius:4px;margin:7px 0;width:74%}
.k-ai .chat{border-left:1px solid var(--rule);padding:12px;display:flex;flex-direction:column;gap:8px;background:#FDFCFA}
.bub{padding:8px 10px;border-radius:10px;line-height:1.4;font-size:9.5px}
.bub.me{background:var(--ink);color:var(--paper);align-self:flex-end;max-width:85%}
.bub.ai{background:var(--paper-2);color:var(--ink)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);border-radius:999px;padding:2px 7px;font-size:8.5px;background:#fff}
.typing{display:flex;gap:3px;padding:6px 0}.typing b{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing b:nth-child(2){animation-delay:.2s}.typing b:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.k-notif{padding:16px;gap:8px;align-content:start;grid-template-columns:1fr}
.nt{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--rule);border-radius:10px;background:#fff}
.nt .dot{width:10px;height:10px;border-radius:50%}
.nt .t{color:var(--ink);font-size:10px}.nt .s{color:var(--muted);font-size:9px}
.nt.muted{opacity:.45}
.quiet{display:flex;justify-content:space-between;align-items:center;padding:10px;border-radius:10px;background:var(--paper-2);color:var(--ink)}
.tog{width:30px;height:17px;border-radius:999px;background:var(--ink);position:relative}.tog::after{content:"";position:absolute;right:2px;top:2px;width:13px;height:13px;border-radius:50%;background:var(--hl-citron)}
.k-sync{grid-template-columns:1.4fr .8fr;gap:16px;padding:18px;align-items:center}
.laptop{border:1px solid var(--rule);border-radius:8px;padding:12px;background:#fff}
.phone-s{border:1px solid var(--rule);border-radius:16px;padding:14px 10px;background:#fff;aspect-ratio:9/16;max-width:100%;display:flex;flex-direction:column}
.status{display:inline-flex;gap:6px;align-items:center;background:var(--hl-mint);color:var(--ink);border-radius:999px;padding:4px 9px;margin-top:10px;font-size:9px}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:#2FA55A}
.k-empty{place-items:center;padding:28px;text-align:center}
.paper-fold{width:84px;height:100px;background:#fff;border:1px solid var(--rule);border-radius:6px;position:relative;margin:0 auto 14px;transform:rotate(-6deg);box-shadow:8px 8px 0 var(--hl-lilac)}
.paper-fold::after{content:"";position:absolute;right:-1px;top:-1px;border-style:solid;border-width:0 22px 22px 0;border-color:transparent var(--paper) #E9E6DD transparent}
.k-empty .t{font-family:var(--f-display);font-size:16px;color:var(--ink)}
.btn-mini{display:inline-block;margin-top:10px;background:var(--ink);color:var(--paper);border-radius:999px;padding:6px 12px}
.k-onb{grid-template-columns:1fr 1fr;gap:18px;padding:18px;align-items:center}
.steps{display:flex;gap:4px;margin-bottom:12px}.steps i{flex:1;height:4px;border-radius:4px;background:var(--rule)}.steps i.on{background:var(--ink)}
.field{border:1px solid var(--rule);border-radius:8px;padding:8px;margin:6px 0;color:var(--muted);background:#fff}
.field.f{border-color:var(--ink);color:var(--ink)}
.timer{font-family:var(--f-display);font-size:38px;color:var(--ink);line-height:1}
.k-film{padding:16px;gap:10px;grid-template-columns:repeat(4,1fr);align-content:center}
.frame{aspect-ratio:3/4;border-radius:8px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:6px;color:var(--ink)}
.frame:nth-child(1){background:var(--hl-sky)}.frame:nth-child(2){background:var(--hl-citron)}.frame:nth-child(3){background:var(--hl-rose)}.frame:nth-child(4){background:var(--hl-mint)}
.frame::before{content:"";position:absolute;left:18%;top:18%;width:64%;aspect-ratio:1;border-radius:50%;border:2px solid var(--ink);opacity:.8}
.frame:nth-child(2)::before{border-radius:6px}.frame:nth-child(3)::before{border-radius:50% 50% 6px 6px}
.k-film .scrub{grid-column:1/-1;height:6px;border-radius:4px;background:var(--rule);position:relative}
.k-film .scrub::after{content:"";position:absolute;left:0;top:0;bottom:0;width:62%;background:var(--ink);border-radius:4px}

/* ---------- testimonials ---------- */
.quotes{display:grid;grid-template-columns:5fr 7fr;gap:clamp(24px,5vw,72px);align-items:start}
.q-stage{position:relative;min-height:320px}
.q{position:absolute;inset:0;opacity:0;transform:translateY(16px);transition:opacity .6s var(--ease),transform .6s var(--ease);pointer-events:none}
.q.on{opacity:1;transform:none;pointer-events:auto;position:relative}
.q blockquote{margin:0;font-family:var(--f-body);font-weight:300;font-size:clamp(22px,2.4vw,30px);line-height:1.38;text-wrap:pretty}
.q blockquote::before{content:"“";font-family:var(--f-display);font-size:1.6em;line-height:0;vertical-align:-.36em;margin-right:4px;color:var(--link)}
.q figcaption{margin-top:24px;display:flex;align-items:center;gap:14px}
.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:18px;color:var(--ink);flex:none}
.q figcaption b{display:block;font-weight:500}
.q figcaption span{color:var(--muted);font-size:16px}
.q-ctrl{display:flex;align-items:center;gap:14px;margin-top:28px}
.circ{width:46px;height:46px;border-radius:50%;border:1px solid var(--ink);background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:transform .3s var(--ease),background .3s}
.circ:hover{background:var(--ink);color:var(--paper);transform:scale(1.06)}
.q-count{font-variant-numeric:tabular-nums}
.q-people{display:flex;flex-direction:column;gap:2px;border-left:1px solid var(--rule)}
.q-person{all:unset;cursor:pointer;display:flex;gap:12px;align-items:center;padding:12px 16px;border-left:2px solid transparent;margin-left:-1px;transition:background .25s,border-color .25s;color:var(--ink-2)}
.q-person:hover{background:var(--paper-2)}
.q-person[aria-current="true"]{border-left-color:var(--ink);color:var(--ink)}
.q-person:focus-visible{outline:2px solid var(--link)}
.q-person .avatar{width:32px;height:32px;font-size:13px}
.q-person small{display:block;color:var(--muted);font-size:14px}
@media (max-width:860px){.quotes{grid-template-columns:1fr}.q-people{display:none}}

/* ---------- now / sidequests ---------- */
.now{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.now-item{border-top:2px solid var(--ink);padding-top:16px}
.now-item h4{margin:8px 0 6px;font-family:var(--f-display);font-weight:400;font-size:24px}
.now-item p{margin:0;color:var(--ink-2);font-size:17px}
.sq{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:48px}
.sq a{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px 24px;border-radius:16px;background:var(--card);border:1px solid var(--rule);text-decoration:none;transition:transform .5s var(--ease),box-shadow .5s}
.sq a:hover{transform:translateY(-4px) rotate(-.6deg);box-shadow:0 22px 40px -24px rgba(27,29,42,.4)}
.sq h4{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px}
.sq p{margin:2px 0 0;color:var(--muted);font-size:16px}

{slug:'ask-fieldnote',title:'Ask Fieldnote, a research assistant that cites its sources',short:'Ask Fieldnote',cat:'AI',type:'Product design & prototyping',year:'2026',tone:'var(--hl-citron)',kind:'ai',file:'fieldnote — Field interviews',wide:true,
 dek:'Designing an AI side panel that researchers trust because every answer points back to the line it came from.',

/* ------------------------------------------------ router + transitions ------------------------------------------------ */
const app=$('#app');
let current=null, busy=false;
const SECTIONS=['top','work','notes','contact'];
function parse(){
 const h=decodeURIComponent(location.hash.slice(1));
 if(h.startsWith('work-')){const p=PROJECTS.find(x=>x.slug===h.slice(5));if(p)return{key:'case-'+p.slug,view:'case',p}}
 if(h==='about')return{key:'about',view:'about'};
 return{key:'home',view:'home',section:SECTIONS.includes(h)?h:null};
}
function render(r){
 app.innerHTML=r.view==='case'?viewCase(r.p):r.view==='about'?viewAbout():viewHome();
 document.title=r.view==='case'?`${r.p.short} — Noor Haddad`:r.view==='about'?'About — Noor Haddad':'Marginalia — Noor Haddad';
 $$('.nav a').forEach(a=>a.classList.toggle('active',(r.view==='about'&&a.dataset.nav==='about')||(r.view==='case'&&a.dataset.nav==='work')));
 initPage();
}
function animate(el,kf,opt){return reduce?Promise.resolve():el.animate(kf,{fill:'forwards',...opt}).finished}
async function curtainIn(label){
 const bars=$$('.curtain i'); $('#curtainLabel').textContent=label||'';
 await Promise.all(bars.map((b,i)=>animate(b,[{transform:'scaleY(0)',transformOrigin:'bottom'},{transform:'scaleY(1)',transformOrigin:'bottom'}],{duration:520,delay:i*60,easing:'cubic-bezier(.7,0,.3,1)'})));
 if(label) await animate($('#curtainLabel'),[{opacity:0,transform:'translateY(12px)'},{opacity:1,transform:'none'}],{duration:280});
}
async function curtainOut(){
 const bars=$$('.curtain i');
 animate($('#curtainLabel'),[{opacity:1},{opacity:0}],{duration:200});
 await Promise.all(bars.map((b,i)=>animate(b,[{transform:'scaleY(1)',transformOrigin:'top'},{transform:'scaleY(0)',transformOrigin:'top'}],{duration:560,delay:120+i*60,easing:'cubic-bezier(.7,0,.3,1)'})));
}
async function go(){
 const r=parse();
 closeMenu();
 if(r.key===current){ if(r.section) scrollToEl(r.section); return; }
 if(busy) return; busy=true;
 const first=current===null;
 if(!first) await curtainIn(r.view==='case'?r.p.short:r.view==='about'?'About':'');
 current=r.key; render(r);
 jump(0);
 if(r.section) requestAnimationFrame(()=>scrollToEl(r.section,true));
 if(!first){ app.focus({preventScroll:true}); await curtainOut(); }
 busy=false;
}

/* ------------------------------------------------ scrolling ------------------------------------------------ */
let lenis=null;
if(window.Lenis && !reduce){ lenis=new Lenis({lerp:.09,smoothWheel:true}); const raf=t=>{lenis.raf(t);requestAnimationFrame(raf)}; requestAnimationFrame(raf); }
function jump(y){ lenis?lenis.scrollTo(y,{immediate:true,force:true}):window.scrollTo(0,y) }
function scrollToEl(id,instant){ const el=document.getElementById(id); if(!el)return; if(id==='top'){lenis?lenis.scrollTo(0,{immediate:!!instant}):window.scrollTo({top:0,behavior:instant?'auto':'smooth'});return}
 lenis?lenis.scrollTo(el,{offset:-70,immediate:!!instant}):el.scrollIntoView({behavior:instant?'auto':'smooth'}) }
addEventListener('scroll',()=>$('#hdr').classList.toggle('scrolled',scrollY>8),{passive:true});

/* ------------------------------------------------ per-page behaviour ------------------------------------------------ */
let io, qTimer;
function initPage(){
 // reveals: only elements below the first screen start hidden
 io&&io.disconnect();
 io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.remove('pre');io.unobserve(e.target)}}),{rootMargin:'0px 0px -8% 0px'});
 const vh=innerHeight;
 $$('[data-r]',app).forEach(el=>{ if(!reduce && el.getBoundingClientRect().top>vh*.9){el.classList.add('pre');io.observe(el)} });

 // filters
 $$('.tab',app).forEach(b=>b.addEventListener('click',()=>{
  $$('.tab',app).forEach(x=>x.setAttribute('aria-pressed',x===b));
  const f=b.dataset.filter;
  $$('.proj',app).forEach(p=>{const show=f==='All'||p.dataset.cat===f; p.hidden=!show; if(show){p.classList.remove('pre');p.animate&&!reduce&&p.animate([{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],{duration:500,easing:'cubic-bezier(.2,.8,.2,1)'})}});
 }));

 // testimonials
 clearInterval(qTimer);
 const qs=$$('.q',app);
 if(qs.length){
  let qi=0;
  const show=i=>{qi=(i+qs.length)%qs.length; qs.forEach((q,j)=>{q.classList.toggle('on',j===qi);q.setAttribute('aria-hidden',j!==qi)});
   $$('.q-person',app).forEach((b,j)=>b.setAttribute('aria-current',j===qi)); $('#qCount').textContent=`${String(qi+1).padStart(2,'0')} / ${String(qs.length).padStart(2,'0')}`};
  const restart=()=>{clearInterval(qTimer); if(!reduce) qTimer=setInterval(()=>show(qi+1),7000)};
  $('#qPrev').onclick=()=>{show(qi-1);restart()}; $('#qNext').onclick=()=>{show(qi+1);restart()};
  $$('.q-person',app).forEach(b=>b.onclick=()=>{show(+b.dataset.q);restart()});
  $('#qStage').addEventListener('mouseenter',()=>clearInterval(qTimer)); $('#qStage').addEventListener('mouseleave',restart);
  restart();
 }

 // fan tilt
 const fan=$('.fan',app);
 if(fan&&!reduce&&matchMedia('(hover:hover)').matches){
  fan.addEventListener('mousemove',e=>{const r=fan.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;fan.style.transform=`rotateX(${-y*6}deg) rotateY(${x*8}deg)`});
  fan.addEventListener('mouseleave',()=>fan.style.transform='');
  fan.style.transition='transform .6s cubic-bezier(.2,.8,.2,1)';fan.style.transformStyle='preserve-3d';
 }

 // form
 const form=$('#noteForm',app);
 const formHTML=form?form.innerHTML:'';
 if(form) form.addEventListener('submit',e=>{
  e.preventDefault();
  const checks=[['f-name',v=>v.trim().length>1,'Tell me your name.'],['f-email',v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v),'Add an email I can reply to, like ana@studio.pt.'],['f-msg',v=>v.trim().length>9,'A sentence or two is plenty.']];
  let ok=true;
  checks.forEach(([id,fn,msg])=>{const inp=$('#'+id,form),f=inp.closest('.fld'),bad=!fn(inp.value);f.classList.toggle('bad',bad);f.querySelector('.err').textContent=bad?msg:'';if(bad&&ok){inp.focus();ok=false}});
  if(!ok)return;
  const name=$('#f-name',form).value.trim().split(' ')[0], topic=form.querySelector('[name=topic]:checked').value;
  form.innerHTML=`<div class="sent"><span class="mono" style="color:var(--muted)">${topic}</span><h3>Thanks, ${name.replace(/[<>&]/g,'')}.</h3><p>Your note is drafted and ready. I usually reply within two working days.</p><p class="mono" style="font-size:11px;color:var(--muted)">Template demo · connect this form to your own backend. No message was sent.</p><div><button class="btn ghost" type="button" id="again">Write another</button></div></div>`;
  $('#again',form).onclick=()=>{form.innerHTML=formHTML;$('#f-name',form).focus()};
 });
}

/* ------------------------------------------------ global ui ------------------------------------------------ */
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2200)}
document.addEventListener('click',async e=>{
 const c=e.target.closest('[data-copy]'); if(!c)return;
 try{await navigator.clipboard.writeText(c.dataset.copy);toast('Email copied')}
 catch(err){const s=getSelection(),r=document.createRange();const t=$('#emailText')||c;r.selectNodeContents(t);s.removeAllRanges();s.addRange(r);toast('Selected · press ⌘C to copy')}
});
function openMenu(){document.body.classList.add('menu-open');$('#menuBtn').setAttribute('aria-expanded','true');$('#mnav').setAttribute('aria-hidden','false');lenis&&lenis.stop()}
function closeMenu(){if(!document.body.classList.contains('menu-open'))return;document.body.classList.remove('menu-open');$('#menuBtn').setAttribute('aria-expanded','false');$('#mnav').setAttribute('aria-hidden','true');lenis&&lenis.start()}
$('#menuBtn').onclick=openMenu; $('#menuClose').onclick=closeMenu;
$$('#mnav a').forEach(a=>a.addEventListener('click',()=>{ if(a.getAttribute('href')===location.hash){closeMenu();go()} }));
addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
// same-hash clicks (e.g. "Work" twice) still scroll
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(a&&a.getAttribute('href')===location.hash&&!a.closest('#mnav')){e.preventDefault();go()}});
const tick=()=>{try{$('#clock').textContent=new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Lisbon'}).format(new Date())}catch(e){}};tick();setInterval(tick,30000);
addEventListener('hashchange',go);
go();
})();
</script>
